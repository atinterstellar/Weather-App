<!DOCTYPE html>
<html>
    <head>
        <title>Wind - Weather</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div>
            <h1>Wind Info</h1>
            <h2>Wind Speed : {{ windspeed if windspeed is not none else "N/A" }}</h2>
            <h2>Wind Gust : {{windgust}}</h2>
            <h2>Wind Direction : {{winddir}}</h2>
        </div>
    </body>
</html>
